<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B7BF6"/>
      <stop offset="1" stop-color="#1B3FA8"/>
    </linearGradient>
    <linearGradient id="bubbleB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2BD48A"/>
      <stop offset="1" stop-color="#139A60"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1B4D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="224" rx="104" fill="#FFFFFF" opacity="0.06"/>

  <!-- Interviewer bubble (back, left) -->
  <g filter="url(#shadow)">
    <path d="M104 128 h196 a40 40 0 0 1 40 40 v92 a40 40 0 0 1 -40 40 h-118 l-50 42 v-42 h-28 a40 40 0 0 1 -40 -40 v-92 a40 40 0 0 1 40 -40 z"
          fill="#FFFFFF"/>
    <!-- question mark -->
    <path d="M178 186 a24 24 0 1 1 34 22 c-8 4 -12 9 -12 17 v6" fill="none" stroke="#1B3FA8"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="200" cy="262" r="10" fill="#1B3FA8"/>
  </g>

  <!-- Candidate bubble (front, right) with voice waveform -->
  <g filter="url(#shadow)">
    <path d="M232 262 h168 a36 36 0 0 1 36 36 v74 a36 36 0 0 1 -36 36 h-20 v38 l-46 -38 h-102 a36 36 0 0 1 -36 -36 v-74 a36 36 0 0 1 36 -36 z"
          fill="url(#bubbleB)"/>
    <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
      <line x1="260" y1="322" x2="260" y2="348"/>
      <line x1="290" y1="304" x2="290" y2="366"/>
      <line x1="320" y1="292" x2="320" y2="378"/>
      <line x1="350" y1="310" x2="350" y2="360"/>
      <line x1="380" y1="324" x2="380" y2="346"/>
    </g>
  </g>
</svg>
