<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Interview Gym: a dumbbell (practice) under a speech bubble (interview) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE3F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1E0B4D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded tile with a soft top sheen -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="200" rx="104" fill="#FFFFFF" opacity="0.07"/>

  <!-- Speech bubble with "typing" dots -->
  <g filter="url(#shadow)">
    <path d="M176 92 h160 a36 36 0 0 1 36 36 v58 a36 36 0 0 1 -36 36 h-56 l-24 26 l-24 -26 h-56
             a36 36 0 0 1 -36 -36 v-58 a36 36 0 0 1 36 -36 z" fill="#FFFFFF"/>
    <circle cx="212" cy="157" r="15" fill="#7C3AED"/>
    <circle cx="256" cy="157" r="15" fill="#5B5BD6"/>
    <circle cx="300" cy="157" r="15" fill="#0891B2"/>
  </g>

  <!-- Dumbbell -->
  <g filter="url(#shadow)">
    <rect x="150" y="320" width="212" height="28" rx="14" fill="url(#plate)"/>
    <!-- left plates -->
    <rect x="92"  y="292" width="34" height="84"  rx="14" fill="url(#plate)"/>
    <rect x="122" y="264" width="40" height="140" rx="16" fill="url(#plate)"/>
    <!-- right plates -->
    <rect x="350" y="264" width="40" height="140" rx="16" fill="url(#plate)"/>
    <rect x="386" y="292" width="34" height="84"  rx="14" fill="url(#plate)"/>
  </g>
</svg>
